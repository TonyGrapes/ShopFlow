name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync dependencies
        working-directory: backend
        run: uv sync

      - name: Lint (ruff)
        working-directory: backend
        run: uv run ruff check app/ tests/ alembic/
        
      - name: Prepare .env for docker compose
        run: |
          cp .env.example .env
          sed -i -E 's#^POSTGRES_PASSWORD=.*#POSTGRES_PASSWORD=ci_password#' .env
          sed -i -E 's#^REDIS_PASSWORD=.*#REDIS_PASSWORD=ci_redis_password#' .env
          sed -i -E 's#^MINIO_ROOT_PASSWORD=.*#MINIO_ROOT_PASSWORD=ci_minio_password#' .env
          sed -i -E 's#^MINIO_SECRET_KEY=.*#MINIO_SECRET_KEY=ci_minio_password#' .env
          sed -i -E 's#^SECRET_KEY=.*#SECRET_KEY='"$(openssl rand -hex 32)"'#' .env

          echo "----- .env (MinIO + secrets after prep) -----"
          grep -E '^(MINIO_|SECRET_KEY=|POSTGRES_PASSWORD=|REDIS_PASSWORD=)' .env
      - name: Start test DB + Redis
        # --wait: ждёт healthcheck (Compose 2.40+), exit-code != 0 при провале.
        # Healthcheck db-test использует ${POSTGRES_USER} / ${POSTGRES_DB} —
        # они теперь заданы из .env.
        run: docker compose up -d --wait db-test redis

      - name: Run tests (with coverage)
        working-directory: backend
        run: uv run pytest tests/ -q

      - name: Stop services
        if: always()
        run: docker compose down -v

  frontend:
    name: Frontend (lint + build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Lint (eslint — react-hooks/rules-of-hooks)
        working-directory: frontend
        run: npm run lint:eslint

      - name: Lint (oxlint)
        working-directory: frontend
        run: npm run lint

      - name: Build (tsc + vite)
        working-directory: frontend
        run: npm run build

      - name: Test (vitest)
        working-directory: frontend
        run: npm run test
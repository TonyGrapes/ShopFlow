name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync dependencies
        working-directory: backend
        run: uv sync

      - name: Lint (ruff)
        working-directory: backend
        run: uv run ruff check app/ tests/ alembic/

      - name: Start test DB + Redis
        run: docker compose up -d db-test redis

      - name: Wait for services
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T db-test pg_isready -U shopflow_user -d shopflow_test >/dev/null 2>&1; then
              echo "db-test ready"; break
            fi
            echo "waiting for db-test... ($i/30)"; sleep 2
          done

      - name: Run tests (with coverage)
        working-directory: backend
        run: uv run pytest tests/ -q

      - name: Stop services
        if: always()
        run: docker compose down -v

  frontend:
    name: Frontend (lint + build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Lint (eslint — react-hooks/rules-of-hooks)
        working-directory: frontend
        run: npm run lint:eslint

      - name: Lint (oxlint)
        working-directory: frontend
        run: npm run lint

      - name: Build (tsc + vite)
        working-directory: frontend
        run: npm run build

      - name: Test (vitest)
        working-directory: frontend
        run: npm run test